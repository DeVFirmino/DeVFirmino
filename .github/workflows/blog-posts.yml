name: Latest blog posts

on:
  pull_request:
    paths:
      - README.md
      - assets/readme-blog/**
      - data/latest-posts.json
      - tools/**
      - tests/**
      - .github/workflows/blog-posts.yml
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blog-posts-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test the blog updater
        run: python3 -m unittest discover -s tests -v
      - name: Check the committed cards
        run: python3 tools/update_blog_posts.py --check

  update:
    if: github.event_name != 'pull_request'
    needs: verify
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh the article cards
        run: |
          python3 tools/update_blog_posts.py
          python3 tools/update_blog_posts.py --check
      - name: Commit updated articles
        run: |
          git add -- README.md 'assets/readme-blog/post-*.svg' data/latest-posts.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update the latest blog posts'
          git push

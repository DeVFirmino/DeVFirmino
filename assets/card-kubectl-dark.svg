<rect x="222" y="112" width="46" height="21" rx="3" fill="url(#h-moss)" stroke="#8CA07C" stroke-opacity="0.45" stroke-width="1"/>
<text x="245" y="126.5" text-anchor="middle" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="10" letter-spacing="1.1" fill="#C3B7A4">CKAD</text>

<text x="95" y="126.5" text-anchor="middle" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="10" letter-spacing="1.1" fill="#C3B7A4">KUBERNETES</text>
<rect x="147" y="112" width="66" height="21" rx="3" fill="url(#h-slate)" stroke="#7C9CBC" stroke-opacity="0.45" stroke-width="1"/>

<svg xmlns="http://www.w3.org/2000/svg" width="880" height="150" viewBox="0 0 880 150" role="img" aria-label="kubectl by example">
<defs><pattern id="h-moss" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="5" height="5" fill="#8CA07C" opacity="0.13"/><line x1="0" y1="0" x2="0" y2="5" stroke="#8CA07C" stroke-width="1.6" opacity="0.22"/></pattern><pattern id="h-slate" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="5" height="5" fill="#7C9CBC" opacity="0.13"/><line x1="0" y1="0" x2="0" y2="5" stroke="#7C9CBC" stroke-width="1.6" opacity="0.22"/></pattern></defs>
<rect x="10" y="12" width="862" height="128" rx="12" fill="#000000" opacity="0.35"/>
<rect x="6" y="6" width="862" height="128" rx="12" fill="#2B2621" stroke="#EDE4D3" stroke-opacity="0.18" stroke-width="1"/>
<circle cx="34" cy="43" r="4.5" fill="#D9755A"/>
<text x="52" y="50" font-family="Georgia,'Iowan Old Style','Palatino Linotype','Times New Roman',serif" font-size="21" font-weight="700" fill="#EDE4D3">kubectl by example</text>
<line x1="254" y1="44" x2="778" y2="44" stroke="#EDE4D3" stroke-opacity="0.28" stroke-width="1" stroke-dasharray="1 5" stroke-linecap="round"/>
<text x="846" y="47" text-anchor="end" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="10" letter-spacing="1.4" fill="#D9755A">GITHUB &#8599;</text>
<text x="52" y="76" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#C3B7A4">Imperative kubectl commands, one CKAD section at a time, each run on a throwaway kind</text>
<text x="52" y="95" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#C3B7A4">cluster with the real output and the YAML that a dry run generates.</text>
